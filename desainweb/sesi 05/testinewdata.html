<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Testimoni Anda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>

    <div class="container">
        <h1>Tulis Testimoni Anda</h1>
        <a href="testilistdata.html" class="btn btn-primary">List Data Testimoni</a>
    </div>
    
    <div class="container">
        <div id="liveAlertPlaceholder"></div>
        <button type="button" class="btn btn-primary" id="liveAlertBtn">Tampilkan pemberitahuan</button>
    </div>

    <div class="container">
        <form method="post" id="ftesti">
            <input type="hidden" name="ACT" value="stored">
            <input type="hidden" name="NIM" value="2401010714">

            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" name="NAMA" class="form-control">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="EMAIL" class="form-control">
            </div>
            <div class="form-group">
                <label>Testimoni</label>
                <textarea name="TESTI" class="form-control">Tuliskan testimoni anda</textarea>
            </div>
            <div class="form-group">
                <button type="submit" id="cmdTulis" class="btn btn-primary">Simpan testimoni</button>
            </div>

        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        var NIM = "2401010714"
        var urlAPI = "https://apimhstiki.ptov.my.id/"
        var urlSTORED = `${urlAPI}/testi`

        $(function(){
            $("#infstatus").css("display","none")

            $("#ftesti").on('submit',function(ev){
                ev.preventDefault()
                var nVal = $(this).serialize() //var nVal = $("#ftesti").serialize
                console.log(nVal)

                $.ajax({
                    url: urlSTORED,
                    method: 'POST',
                    data: nVal,
                    dataType: 'json',
                    success: function(dt){
                        if(dt.error==0){
                            $("#infstatus").css("display","block")
                            $("#infstatus").html("Testimoni anda telah tersimpan")
                        }else{
                            $("#infstatus").html("Maaf, terjadi kesalahan saat penyimpanan. Coba lagi!")
                        }
                        setTimeout(function(){
                            window.location.replace("testilistdata.html")
                        },3000)
                    },
                    error:function(){
                        console.log("Maaf, pengiriman data ke server gagal.")
                    }
                })
            })
        })
    </script>

  </body>
</html>
